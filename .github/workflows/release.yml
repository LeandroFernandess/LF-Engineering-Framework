name: Build Release Archives

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  resolve-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - name: Check out workflow revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Validate tag and resolve its commit
        id: resolve
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="$REF_NAME"

          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release tag '$tag'; expected vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi

          git fetch --no-tags origin "+refs/tags/$tag:refs/tags/$tag"
          commit=$(git rev-parse --verify "refs/tags/$tag^{commit}")

          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

  validate-candidate:
    name: Validate tagged revision on all platforms
    needs: resolve-tag
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ needs.resolve-tag.outputs.commit }}

  package:
    name: Package tested revision
    needs: [resolve-tag, validate-candidate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-tag.outputs.commit }}
          persist-credentials: false

      - name: Build archives and checksums
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: ./scripts/package-release.sh "$RELEASE_TAG"

      - name: Upload release archives
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [resolve-tag, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release tag for GitHub CLI verification
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist/

      - name: Confirm tag still points to tested commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.resolve-tag.outputs.commit }}
        run: |
          set -euo pipefail

          tag_ref="repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG"
          ref_type=$(gh api "$tag_ref" --jq '.object.type')
          ref_sha=$(gh api "$tag_ref" --jq '.object.sha')
          tag_depth=0

          while [[ "$ref_type" == "tag" && "$tag_depth" -lt 5 ]]; do
            tag_object="repos/$GITHUB_REPOSITORY/git/tags/$ref_sha"
            ref_type=$(gh api "$tag_object" --jq '.object.type')
            ref_sha=$(gh api "$tag_object" --jq '.object.sha')
            tag_depth=$((tag_depth + 1))
          done

          if [[ "$ref_type" != "commit" || "$ref_sha" != "$RELEASE_COMMIT" ]]; then
            echo "Release tag no longer points to the tested commit." >&2
            exit 1
          fi

          local_commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          if [[ "$local_commit" != "$RELEASE_COMMIT" ]]; then
            echo "Checked-out release tag does not point to the tested commit." >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          archive_base="lf-engineering-framework-$RELEASE_TAG"
          test -f "dist/$archive_base.tar.gz"
          test -f "dist/$archive_base.zip"
          test -f dist/SHA256SUMS

          gh release create "$RELEASE_TAG" \
            "dist/$archive_base.tar.gz" \
            "dist/$archive_base.zip" \
            dist/SHA256SUMS \
            --verify-tag \
            --title "LF Engineering Framework $RELEASE_TAG" \
            --generate-notes
